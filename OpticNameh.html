<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اپتیک‌یار | درسنامه تعاملی اپتیک — دانشگاه فرهنگیان</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.12/300.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.12/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.12/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.12/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.12/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
/* ═══════════════ سامانه طراحی ═══════════════ */
:root{
  --bg:#070b16; --bg2:#0a1122; --card:#101a33; --card2:#152142; --deep:#0b1226;
  --line:rgba(140,160,255,.14); --line2:rgba(140,160,255,.28);
  --txt:#eaeefb; --mut:#a5b0d2; --dim:#67739b;
  --vio:#a78bfa; --blu:#60a5fa; --cyn:#22d3ee; --grn:#34d399; --amb:#fbbf24; --ros:#fb7185; --gold:#fcd34d;
  --grad:linear-gradient(90deg,#a78bfa,#60a5fa,#22d3ee,#34d399,#fbbf24);
  --r:18px; --shadow:0 14px 40px rgba(2,5,18,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',system-ui,sans-serif; background:var(--bg); color:var(--txt);
  font-size:15.5px; line-height:1.95; overflow-x:hidden;
}
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 500px at 85% -5%, rgba(124,58,237,.16), transparent 60%),
    radial-gradient(800px 520px at 5% 15%, rgba(34,211,238,.10), transparent 55%),
    radial-gradient(700px 600px at 50% 110%, rgba(59,130,246,.12), transparent 60%), var(--bg);}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(140,160,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(140,160,255,.035) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#26335c;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#374a82}
a{color:var(--cyn);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input[type=range]{accent-color:#8b5cf6;width:100%;height:22px}
code{font-family:'Courier New',monospace;direction:ltr;display:inline-block}

/* ═══════════════ هدر ═══════════════ */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:rgba(8,12,24,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0}
.brand .logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 22px rgba(99,102,241,.4)}
.brand .logo svg{width:24px;height:24px}
.brand h1{font-size:18px;font-weight:800;line-height:1.3}
.brand h1 small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.searchwrap{flex:1;max-width:520px;position:relative;margin-inline:auto}
.searchwrap input{width:100%;padding:10px 42px 10px 16px;border-radius:13px;border:1px solid var(--line);
  background:var(--deep);color:var(--txt);font-family:inherit;font-size:14px;outline:none;transition:.25s}
.searchwrap input:focus{border-color:#7c8adb;box-shadow:0 0 0 4px rgba(124,92,219,.15)}
.searchwrap .sic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
#searchRes{position:absolute;top:calc(100% + 8px);right:0;left:0;background:var(--card);border:1px solid var(--line2);
  border-radius:15px;box-shadow:var(--shadow);max-height:400px;overflow:auto;display:none;z-index:80}
#searchRes .si{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.15s}
#searchRes .si:hover{background:var(--card2)}
#searchRes .si:last-child{border:none}
#searchRes .badge{flex-shrink:0}
#searchRes .si b{display:block;font-size:13.5px}
#searchRes .si span{font-size:12px;color:var(--mut);display:block;line-height:1.7}
.prog-mini{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex-shrink:0}
.prog-mini .ring{width:34px;height:34px}
#navToggle{display:none;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;width:42px;height:42px;font-size:19px}

/* ═══════════════ چیدمان ═══════════════ */
.shell{display:grid;grid-template-columns:292px 1fr;min-height:calc(100vh - 67px)}
aside#sidebar{position:sticky;top:67px;height:calc(100vh - 67px);overflow-y:auto;padding:18px 14px;border-inline-end:1px solid var(--line);background:rgba(9,14,28,.5)}
.navgroup{margin-bottom:16px}
.navgroup h4{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.5px;padding:0 10px 7px;display:flex;align-items:center;gap:7px}
.navgroup h4::after{content:'';flex:1;height:1px;background:var(--line)}
.navit{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:8.5px 11px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--mut);font-size:13.5px;transition:.2s;margin-bottom:2px}
.navit:hover{background:var(--card);color:var(--txt)}
.navit.on{background:linear-gradient(90deg,rgba(139,92,246,.16),rgba(34,211,238,.08));color:var(--txt);border-color:rgba(139,92,246,.35)}
.navit .nn{width:26px;height:26px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--vio);flex-shrink:0}
.navit.on .nn{background:var(--grad);color:#0b0f1e}
.navit .nt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navit .ck{font-size:12px;color:var(--grn);opacity:0;transition:.2s}
.navit.read .ck{opacity:1}
.navit svg{width:17px;height:17px;flex-shrink:0}
main#main{padding:26px clamp(16px,4vw,48px) 80px;max-width:1200px;width:100%;margin-inline:auto}
.page{animation:rise .45s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(251,191,36,.7)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flash 1.6s ease}

/* ═══════════════ کامپوننت‌ها ═══════════════ */
.card{background:linear-gradient(160deg,var(--card),var(--deep));border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card + .card{margin-top:18px}
.sec-title{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.sec-title .bar{width:6px;height:30px;border-radius:4px;background:var(--grad)}
.sec-title h2{font-size:21px;font-weight:800}
.sec-title small{color:var(--dim);font-size:12.5px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:6px 15px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--mut);transition:.2s}
.chip:hover{border-color:var(--line2);color:var(--txt)}
.chip.hl{background:linear-gradient(90deg,rgba(139,92,246,.2),rgba(34,211,238,.12));color:var(--txt);border-color:rgba(139,92,246,.4)}
.badge{display:inline-block;padding:2.5px 11px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
.b-vio{color:var(--vio);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.1)}
.b-blu{color:var(--blu);border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.1)}
.b-cyn{color:var(--cyn);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.1)}
.b-grn{color:var(--grn);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.b-amb{color:var(--amb);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
.b-ros{color:var(--ros);border-color:rgba(251,113,133,.4);background:rgba(251,113,133,.1)}
.b-gold{color:var(--gold);border-color:rgba(252,211,77,.4);background:rgba(252,211,77,.1)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--txt);font-size:13.5px;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:#7c8adb;box-shadow:0 8px 20px rgba(99,102,241,.25)}
.btn.g{background:var(--grad);color:#0b0f1e;border:none;font-weight:800}
.btn.done{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.5);color:var(--grn)}

/* کارت مفهوم */
.concept{position:relative;background:linear-gradient(160deg,var(--card),var(--deep));border:1px solid var(--line);border-radius:var(--r);padding:24px 24px 20px;margin-bottom:16px;transition:.25s;overflow:hidden}
.concept::before{content:'';position:absolute;top:0;right:0;width:100%;height:3px;background:var(--grad);opacity:.55}
.concept:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:var(--shadow)}
.concept h3{display:flex;align-items:center;gap:11px;font-size:16.5px;font-weight:800;margin-bottom:10px}
.concept h3 .idx{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(34,211,238,.2));border:1px solid rgba(139,92,246,.4);display:grid;place-items:center;font-size:13px;color:var(--vio);flex-shrink:0}
.concept .def{color:var(--mut);font-size:14px;border-inline-start:3px solid rgba(139,92,246,.5);padding-inline-start:14px;margin-bottom:12px}
.concept ul.pts{list-style:none}
.concept ul.pts li{position:relative;padding-inline-start:24px;color:var(--txt);font-size:14px;margin-bottom:7px}
.concept ul.pts li::before{content:'';position:absolute;right:6px;top:12px;width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,var(--cyn),var(--blu));transform:rotate(45deg)}
.exbox{margin-top:13px;padding:12px 16px;border-radius:13px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.25);font-size:13.5px;color:#c9f5e3}
.exbox b{color:var(--grn)}
.notebox{margin-top:11px;padding:12px 16px;border-radius:13px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);font-size:13.5px;color:#fdecc8}

/* کارت فرمول */
.fcard{background:linear-gradient(160deg,#101a36,#0b1226);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:15px;transition:.25s}
.fcard:hover{border-color:rgba(124,92,219,.5);box-shadow:0 0 30px rgba(124,92,246,.12)}
.fcard .fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 20px;border-bottom:1px solid var(--line)}
.fcard .fhead b{font-size:14.5px}
.fcard .ftex{direction:ltr;text-align:center;padding:20px 14px;background:radial-gradient(ellipse at 50% 0%,rgba(124,92,246,.09),transparent 70%);overflow-x:auto}
.fcard .fuse{padding:12px 20px 4px;font-size:13.5px;color:var(--mut)}
.fcard .fvars{padding:8px 20px 16px;display:flex;flex-wrap:wrap;gap:8px}
.fcard .fvars .v{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:12.5px}
.fcard .fvars .v code{color:var(--cyn);font-weight:700;font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:15px}
.fgrid .fcard{margin-bottom:0}

/* نکات و جمع‌بندی */
.tips ol{list-style:none;counter-reset:tip}
.tips ol li{counter-increment:tip;position:relative;padding:11px 52px 11px 16px;margin-bottom:9px;background:var(--card2);border:1px solid var(--line);border-radius:13px;font-size:13.8px;transition:.2s}
.tips ol li:hover{border-color:rgba(251,191,36,.4)}
.tips ol li::before{content:counter(tip,decimal);position:absolute;right:13px;top:50%;transform:translateY(-50%);width:27px;height:27px;border-radius:9px;background:linear-gradient(135deg,var(--amb),#f97316);color:#1a1206;display:grid;place-items:center;font-weight:800;font-size:13px}
.summary{border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,rgba(167,139,250,.6),rgba(34,211,238,.5),rgba(251,191,36,.5)) border-box;font-size:14.5px;line-height:2.1}
details.fn{background:var(--deep);border:1px solid var(--line);border-radius:13px;padding:12px 18px;margin-top:14px;font-size:13px;color:var(--mut)}
details.fn summary{cursor:pointer;color:var(--dim);font-weight:600}
details.fn[open] summary{margin-bottom:8px;color:var(--vio)}
details.fn li{margin-inline-start:20px;margin-bottom:5px}

/* هدر جلسه */
.shead{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,rgba(124,58,237,.14),rgba(34,211,238,.07) 55%,rgba(251,191,36,.06));border:1px solid var(--line2);border-radius:22px;padding:26px}
.shead .num{width:86px;height:86px;border-radius:24px;background:var(--grad);display:grid;place-items:center;font-size:38px;font-weight:800;color:#0b0f1e;box-shadow:0 10px 30px rgba(139,92,246,.35);flex-shrink:0}
.shead h1{font-size:clamp(19px,2.6vw,26px);font-weight:800;line-height:1.6}
.shead .meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}
.shead .grow{flex:1;min-width:250px}

/* نمودارها */
.diagram-card{background:var(--deep);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:15px}
.diagram-card h4{font-size:14.5px;margin-bottom:12px;color:var(--cyn);display:flex;gap:8px;align-items:center}
.mmd{display:flex;justify-content:center;overflow-x:auto}
.mmd svg{max-width:100%}

/* ═══════════════ ویجت‌ها ═══════════════ */
.widget{background:linear-gradient(160deg,#0e1730,#0a1122);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}
.widget .wt{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.widget .wt h3{font-size:16.5px;font-weight:800}
.widget .wd{font-size:13px;color:var(--mut);margin-bottom:14px}
.wgrid{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
.wstage{background:radial-gradient(ellipse at 50% 40%,#101b3a,#090f22);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.wstage svg,.wstage canvas{display:block;width:100%;height:auto}
.ctl{margin-bottom:13px}
.ctl label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.ctl .cv{color:var(--cyn);font-weight:700}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:12.5px;font-weight:600;transition:.2s}
.seg button.on{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(34,211,238,.2));color:var(--txt);border-color:rgba(139,92,246,.55)}
.winfo{margin-top:15px;display:flex;flex-direction:column;gap:8px}
.winfo .row{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;font-size:12.8px}
.winfo .row b{color:var(--cyn)}
.winfo .props{display:flex;flex-wrap:wrap;gap:7px}

/* ═══════════════ داشبورد ═══════════════ */
.hero{position:relative;border-radius:26px;padding:clamp(26px,4vw,46px);overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(130deg,rgba(124,58,237,.2),rgba(34,211,238,.1) 50%,rgba(251,191,36,.08))}
.hero::before{content:'';position:absolute;top:-120px;left:-90px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 65%);pointer-events:none}
.hero h2{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.7;margin-bottom:10px}
.hero h2 .gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:720px;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin-top:24px}
.stat{background:rgba(10,16,32,.6);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.sess-card{display:flex;gap:14px;align-items:center;background:linear-gradient(160deg,var(--card),var(--deep));border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.22s}
.sess-card:hover{transform:translateY(-4px);border-color:rgba(124,92,219,.55);box-shadow:var(--shadow)}
.sess-card .n{width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--vio);flex-shrink:0;border:1px solid var(--line)}
.sess-card.read .n{background:var(--grad);color:#0b0f1e;border:none}
.sess-card b{display:block;font-size:14px;line-height:1.7}
.sess-card small{color:var(--dim);font-size:11.5px}
.sess-card .st{margin-inline-start:auto;color:var(--grn);opacity:0}
.sess-card.read .st{opacity:1}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gr-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13.5px}
.gr-row .gt{width:210px;flex-shrink:0;color:var(--mut)}
.gr-row .gb{flex:1;height:14px;border-radius:8px;background:var(--deep);overflow:hidden;border:1px solid var(--line)}
.gr-row .gb i{display:block;height:100%;border-radius:8px;background:var(--grad)}
.gr-row .gp{width:56px;text-align:left;font-weight:800;color:var(--amb)}
.chap{display:flex;gap:13px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:10px;transition:.2s}
.chap:hover{border-color:var(--line2)}
.chap .cn{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,rgba(96,165,250,.25),rgba(34,211,238,.15));border:1px solid rgba(96,165,250,.35);display:grid;place-items:center;font-weight:800;color:var(--blu);flex-shrink:0;font-size:14px}
.chap b{font-size:13.8px;display:block}
.chap span{font-size:12.3px;color:var(--dim)}
.glos-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;transition:.2s}
.glos-card:hover{border-color:rgba(34,211,238,.45);transform:translateY(-3px)}
.glos-card b{color:var(--cyn);font-size:15px}
.glos-card p{font-size:13px;color:var(--mut);margin-top:5px}
pre.code{direction:ltr;text-align:left;background:#080d1c;border:1px solid var(--line);border-radius:13px;padding:16px;font-size:12.5px;overflow-x:auto;color:#9fd2ff;line-height:1.8}
.tbl{width:100%;border-collapse:collapse;font-size:13.3px}
.tbl th{background:var(--card2);color:var(--cyn);padding:9px 14px;text-align:right;border-bottom:2px solid var(--line2)}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--mut)}
.tbl td:first-child{color:var(--txt);font-weight:600}
footer{text-align:center;color:var(--dim);font-size:12px;padding:26px;border-top:1px solid var(--line);margin-top:40px}
@media(max-width:1060px){
  .shell{grid-template-columns:1fr}
  aside#sidebar{position:fixed;right:0;top:67px;z-index:70;width:290px;transform:translateX(100%);transition:.3s;background:#0a1020;box-shadow:var(--shadow)}
  aside#sidebar.open{transform:none}
  #navToggle{display:block}
  .prog-mini span{display:none}
  .wgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">

function svgEl(t,a={},p){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

/* ───── کنترل اسلایدر ───── */
function ctl(box,label,min,max,step,val,unit,cb){
 const w=document.createElement('div');w.className='ctl';
 w.innerHTML=`<label><span>${label}</span><span class="cv"></span></label>`;
 const r=document.createElement('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=val;
 const cv=w.querySelector('.cv');
 const upd=()=>{cv.textContent=(unit==='nm'?toFa(r.value)+' نانومتر':toFa(r.value)+(unit?' '+unit:''));};
 r.addEventListener('input',()=>{upd();cb(+r.value);});
 upd();w.appendChild(r);box.appendChild(w);return r;}

  b=k>=66?255:(k<=19?0:138.52*Math.log(k-10)-305.04);
  const c=v=>Math.max(0,Math.min(255,Math.round(v)));return [c(r),c(g),c(b)];}
 function draw(){
  const x=cv.getContext('2d');x.clearRect(0,0,640,330);
  x.fillStyle='#05070f';x.fillRect(0,0,640,330);
  const padL=50,padR=20,padT=24,padB=40,W=640-padL-padR,H=330-padT-padB;
  const lmin=100e-9,lmax=3000e-9;
  const lam=2.898e-3/T,Bm=planck(lam,T);
  x.strokeStyle='#26335c';x.lineWidth=1;
  x.beginPath();x.moveTo(padL,padT);x.lineTo(padL,padT+H);x.lineTo(padL+W,padT+H);x.stroke();
  x.fillStyle='#67739b';x.font='10.5px Vazirmatn';x.textAlign='center';
  for(let l=500;l<=3000;l+=500){const px=padL+((l*1e-9)-lmin)/(lmax-lmin)*W;x.fillText(toFa(l)+' nm',px,330-18);
   x.strokeStyle='rgba(103,115,155,.18)';x.beginPath();x.moveTo(px,padT);x.lineTo(px,padT+H);x.stroke();}
  const px2=py=>padL+(py-200e-9)/(2800e-9)*W, py2=v=>padT+H-(v/Bm)*H*0.82;
  /* منحنی چشم */
  if(eye.checked){x.strokeStyle='rgba(251,191,36,.65)';x.setLineDash([5,5]);x.beginPath();
   for(let l=380;l<=700;l+=4){const v=Math.exp(-Math.pow(l-555,2)/(2*42*42));
    const X=px2(l*1e-9),Y=padT+H-v*H*0.75;l===380?x.moveTo(X,Y):x.lineTo(X,Y);}
   x.stroke();x.setLineDash([]);}
  /* منحنی پلانک */
  const grd=x.createLinearGradient(padL,0,padL+W,0);
  grd.addColorStop(0,'#7c3aed');grd.addColorStop(.25,'#3b82f6');grd.addColorStop(.5,'#22d3ee');grd.addColorStop(.7,'#34d399');grd.addColorStop(1,'#f59e0b');
  x.strokeStyle=grd;x.lineWidth=2.6;x.beginPath();let started=false;
  for(let i=0;i<=300;i++){const l=lmin+(lmax-lmin)*i/300;const v=planck(l,T);
   if(v>Bm*1.02)continue;const X=px2(l),Y=Math.max(padT,padT+H-(v/Bm)*H*0.82);
   if(!started){x.moveTo(X,Y);started=true;}else x.lineTo(X,Y);}
  x.stroke();
  /* نقطهٔ وین */
  const wx=px2(lam);
  if(wx>padL&&wx<padL+W){x.strokeStyle='rgba(244,114,182,.7)';x.setLineDash([4,4]);x.beginPath();x.moveTo(wx,padT);x.lineTo(wx,padT+H);x.stroke();x.setLineDash([]);
   x.fillStyle='#f472b6';x.beginPath();x.arc(wx,py2(Bm),4.5,0,7);x.fill();
   x.fillStyle='#f472b6';x.font='11px Vazirmatn';x.fillText('λ_max',wx,padT+14);}
  const [cr,cg,cb]=kelvin(T);
  info.innerHTML=`<div class="row"><span>دمای جسم</span><b>${toFa(T)} کلوین</b></div>
  <div class="row"><span>طول‌موج بیشینه — وین</span><b>${toFa((lam*1e9).toFixed(0))} نانومتر</b></div>
  <div class="row"><span>توان نسبی — $T^4$</span><b>${toFa(Math.pow(T/5778,4).toFixed(2))}× خورشید</b></div>
  <div class="row"><span>رنگ تقریبی</span><b><span style="display:inline-block;width:40px;height:15px;border-radius:5px;background:rgb(${cr},${cg},${cb});vertical-align:middle"></span></b></div>
  <div class="props"><span class="badge b-amb">مربع زیر منحنی ∝ $\\sigma T^4$</span></div>`;
  if(window.renderMathInElement)renderMathInElement(info,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});
 }
 draw();
}};

  <div style="display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap">

 window.scrollTo({top:0});

/* ── آزمایشگاه ── */
function pageLab(){
 const cards=Object.entries(WIDGETS).map(([k,w])=>`
  <div class="widget"><div class="wt"><h3>🔬 ${w.title}</h3></div><div class="wd">${w.desc} <span style="color:var(--dim)">· مرتبط با ${w.sess.map(id=>{const ss=COURSE.sessions.find(x=>x.id===id);return ss?`<a onclick="go('s/${id}')" style="cursor:pointer">جلسهٔ ${toFa(ss.num)}</a>`:'';}).join('، ')}</span></div><div data-widget="${k}"></div></div>`).join('');
 main.innerHTML=`<div class="page">
  <div class="sec-title" style="margin-top:6px"><span class="bar"></span><h2>آزمایشگاه تعاملی اپتیک</h2><small>مسیر پرتوها، آینه‌ها، عدسی‌ها و پدیده‌های موجی را خودتان کاوش کنید</small></div>
  ${cards}
 </div>`;
 after(main);
}

/* ── مرجع فرمول‌ها ── */
function pageRefs(){
 const cats=Object.keys(CATS);
 let html=`<div class="page"><div class="sec-title" style="margin-top:6px"><span class="bar"></span><h2>مرجع سریع فرمول‌ها</h2><small>تمام روابط ${toFa(COURSE.sessions.length)} جلسه به تفکیک موضوع</small></div>`;
 cats.forEach(cat=>{
  const items=[];
  COURSE.sessions.forEach(s=>s.formulas.forEach((f,i)=>{if(f.cat===cat)items.push({f,s,i});}));
  if(!items.length)return;
  html+=`<div class="sec-title"><span class="bar"></span><h2 style="font-size:17px">${CATS[cat].l}</h2><small>${toFa(items.length)} رابطه</small></div><div class="fgrid">`;
  items.forEach(it=>{html+=formulaCard(it.f,it.s)+`<div style="text-align:left;margin:-6px 16px 12px"><a onclick="go('s/${it.s.id}','f-${it.s.id}-${it.i}')" style="cursor:pointer;font-size:12px">مشاهده در جلسهٔ ${toFa(it.s.num)} ↗</a></div>`;});
  html+=`</div>`;
 });
 html+=`</div>`;
 main.innerHTML=html;
 main.querySelectorAll('.fgrid').forEach(fg=>{const arr=[];fg.querySelectorAll('.fcard').forEach(fc=>arr.push(fc));});
 /* رندر فرمول‌ها */
 let gi=0;
 const flat=[];cats.forEach(cat=>COURSE.sessions.forEach(s=>s.formulas.forEach((f,i)=>{if(f.cat===cat)flat.push(f);})));
 main.querySelectorAll('.ftex').forEach((el,i)=>{try{katex.render(flat[i].tex,el,{displayMode:true,throwOnError:false,strict:false});}catch(e){el.textContent=flat[i].tex;}});
 katexify(main);
 /* آدرس‌های جلسه برای فرمول‌ها */
 main.querySelectorAll('.fgrid .fcard').forEach((fc,idx)=>{
   const link=fc.nextElementSibling;
 });
}

/* ── واژه‌نامه ── */
function pageGlossary(){
 const cards=COURSE.glossary.map(g=>`<div class="glos-card"><b>${g.t}</b><span class="badge b-cyn" style="margin-inline-start:8px">${g.s}</span><p>${g.d}</p></div>`).join('');
 main.innerHTML=`<div class="page"><div class="sec-title" style="margin-top:6px"><span class="bar"></span><h2>واژه‌نامهٔ تخصصی</h2><small>${toFa(COURSE.glossary.length)} اصطلاح کلیدی دوره</small></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px">${cards}</div></div>`;

}

function buildSidebar(){
 const sb=$('#sidebar');
 const I={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>',lab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>',ref:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',glo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',gde:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>'};
 sb.innerHTML=`
 <div class="navgroup"><h4>نمای کلی</h4>
  <button class="navit" data-p="home">${I.home}<span class="nt">داشبورد و نقشهٔ راه</span></button>
 </div>
 <div class="navgroup"><h4>جلسات درس — ${toFa(COURSE.sessions.length)} جلسه</h4>
  ${COURSE.sessions.map(s=>`<button class="navit ${readSet.has(s.id)?'read':''}" data-p="s/${s.id}"><span class="nn">${toFa(s.num)}</span><span class="nt">${s.title}</span><span class="ck">✔</span></button>`).join('')}
 </div>
 <div class="navgroup"><h4>ابزارهای یادگیری</h4>
  <button class="navit" data-p="lab">${I.lab}<span class="nt">آزمایشگاه تعاملی</span></button>
  <button class="navit" data-p="refs">${I.ref}<span class="nt">مرجع فرمول‌ها</span></button>
  <button class="navit" data-p="glossary">${I.glo}<span class="nt">واژه‌نامهٔ تخصصی</span></button>
  <button class="navit" data-p="guide">${I.gde}<span class="nt">راهنمای توسعه و تدوین</span></button>

 sb.querySelectorAll('.navit').forEach(b=>b.onclick=()=>{go(b.dataset.p);$('#sidebar').classList.remove('open');});
}
function setActive(p){document.querySelectorAll('.navit').forEach(b=>b.classList.toggle('on',b.dataset.p===p));}
function updateProg(){
 const total=COURSE.sessions.length,read=readSet.size,r=94.2;
 $('#progRing').style.strokeDashoffset=r-(read/total)*r;
 $('#progTxt').textContent=read===total?'همهٔ جلسات مطالعه شد ✔':`مطالعهٔ ${toFa(read)} از ${toFa(total)} جلسه`;
}
function route(){
 const h=location.hash.replace(/^#\//,'');
 if(!h||h==='home'){pageHome();setActive('home');}
 else if(h.startsWith('s/')){const [id,anchor]=h.slice(2).split('@');pageSession(id,anchor);setActive('s/'+id);}
 else if(h==='lab'){pageLab();setActive('lab');}
 else if(h==='refs'){pageRefs();setActive('refs');}
 else if(h==='glossary'){pageGlossary();setActive('glossary');}
 else if(h==='guide'){pageGuide();setActive('guide');}
}
function go(p,anchor){location.hash='#/'+(anchor?p+'@'+anchor:p);window.scrollTo({top:0});}
window.addEventListener('hashchange',route);

/* ── جست‌وجو ── */
let INDEX=[];
function buildIndex(){
 INDEX=[];
 COURSE.sessions.forEach(s=>{
  INDEX.push({type:'جلسه',cls:'b-vio',title:`جلسهٔ ${toFa(s.num)} — ${s.title}`,sub:s.topics.slice(0,3).join(' · '),page:'s/'+s.id,text:(s.title+' '+s.topics.join(' ')+' '+s.summary).toLowerCase()});
  s.concepts.forEach((c,i)=>INDEX.push({type:'مفهوم',cls:'b-cyn',title:c.t,sub:(c.def||'').slice(0,80),page:'s/'+s.id,anchor:'c-'+s.id+'-'+i,text:(c.t+' '+(c.def||'')+' '+(c.pts||[]).join(' ')).toLowerCase()}));
  s.formulas.forEach((f,i)=>INDEX.push({type:'فرمول',cls:'b-amb',title:f.t,sub:f.use.slice(0,80),page:'s/'+s.id,anchor:'f-'+s.id+'-'+i,text:(f.t+' '+f.use).toLowerCase()}));
 });
 COURSE.glossary.forEach(g=>INDEX.push({type:'واژه',cls:'b-grn',title:g.t,sub:g.d.slice(0,80),page:'glossary',text:(g.t+' '+g.d).toLowerCase()}));
}
$('#searchIn').addEventListener('input',e=>{
 const q=e.target.value.trim().toLowerCase();
 const res=$('#searchRes');
 if(q.length<2){res.style.display='none';return;}
 const hits=INDEX.filter(it=>it.text.includes(q)).slice(0,10);
 if(!hits.length){res.innerHTML='<div class="si"><span style="color:var(--dim)">موردی یافت نشد…</span></div>';res.style.display='block';return;}
 res.innerHTML=hits.map((h,i)=>`<div class="si" data-i="${i}"><span class="badge ${h.cls}">${h.type}</span><div><b>${h.title}</b><span>${h.sub}</span></div></div>`).join('');
 res.style.display='block';
 res.querySelectorAll('.si').forEach(el=>el.onclick=()=>{const h=hits[+el.dataset.i];go(h.page,h.anchor);res.style.display='none';$('#searchIn').value='';});
});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))$('#searchRes').style.display='none';});
$('#navToggle').onclick=()=>$('#sidebar').classList.toggle('open');

/* ═══════════════ راه‌اندازی ═══════════════ */
if(window.mermaid){mermaid.initialize({startOnLoad:false,securityLevel:'loose',fontFamily:'Vazirmatn',theme:'base',
 themeVariables:{darkMode:true,background:'#0b1226',primaryColor:'#182448',primaryTextColor:'#eaeefb',primaryBorderColor:'#5b6fd6',
 lineColor:'#7c8adb',secondaryColor:'#1a2b4a',tertiaryColor:'#101a33',fontSize:'14px',
 actorBkg:'#182448',actorBorder:'#5b6fd6',actorTextColor:'#eaeefb',sectionBkgColor:'#131c38',altSectionBkgColor:'#0e1630',taskBkgColor:'#182448'}});}
buildSidebar();buildIndex();updateProg();
if(location.hash==='')location.hash='#/home';
route();
</script>
